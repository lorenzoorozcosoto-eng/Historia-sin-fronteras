<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Sin Fronteras</title>

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="iniciosesion.css">
</head>

<body>

    <!-- FORMAS DE FONDO -->
    <div class="background-shape top"></div>
    <div class="background-shape bottom"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <!-- PANEL DE INICIO DE SESIÓN -->
        <div class="login-panel">

            <div class="logo">
                <a href="inicio.html">
                    <img src="celstatecontenido-s-removebg-preview.png" width="60" height="60" alt="Logo">
                </a>
            </div>

            <h1>Historia Sin Fronteras</h1>

            <p class="subtitle">
                ¡Aprender es una aventura!
            </p>

            <form action="explorarmapa.html" method="get">

                <label for="correo">Correo Electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="********"
                    required
                >

                <a href="explorarmapa.html">
                    <button class="btn-login" type="button">
                        inicio sesión
                    </button>
                </a>

                <div class="separator">
                    <span>o</span>
                </div>

                <a href="Registro.html" class="register-link">
                    <button class="btn-register" type="button">
                        Crear Cuenta
                    </button>
                </a>

            </form>

        </div>

        <!-- PANEL DE ILUSTRACIÓN -->
        <div class="illustration-panel">

            <div class="floating globe">🌎</div>
            <div class="floating book">📚</div>
            <div class="floating plane">✈️</div>
            <div class="floating temple">🏛️</div>

            <div class="hero-content">

                <h2>Explora la Historia del Mundo</h2>

                <p>
                    Aprende mediante retos interactivos, viajes culturales
                    y aventuras educativas diseñadas para descubrir el pasado
                    de la humanidad.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
