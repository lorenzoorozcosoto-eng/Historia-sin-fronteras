<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia Sin Fronteras</title>

    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="iniciosesion.css">
    <script src="../js/sesion.js"></script>
</head>

<body>

    <!-- FORMAS DE FONDO -->
    <div class="background-shape top"></div>
    <div class="background-shape bottom"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <!-- PANEL DE INICIO DE SESIÓN -->
        <div class="login-panel">

            <div class="logo">
                <a href="../inicio/inicio.html">
                    <img src="../img/logo.png" width="60" height="60" alt="Logo">
                </a>
            </div>

            <h1>Historia Sin Fronteras</h1>

            <p class="subtitle">
                ¡Aprender es una aventura!
            </p>

            <form id="form-login">

                <label for="correo">Correo electrónico o usuario</label>

                <input
                    type="text"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="contrasena"
                    placeholder="********"
                    required
                >

                <button class="btn-login" type="submit">
                    Iniciar sesión
                </button>

                <div id="boton-google" style="display:flex;justify-content:center;margin-top:14px;"></div>

                <div class="separator">
                    <span>o</span>
                </div>

                <a href="../registro/registro.html" class="register-link">
                    <button class="btn-register" type="button">
                        Crear Cuenta
                    </button>
                </a>

            </form>

        </div>

        <!-- PANEL DE ILUSTRACIÓN -->
        <div class="illustration-panel">

            <div class="floating globe">🌎</div>
            <div class="floating book">📚</div>
            <div class="floating plane">✈️</div>
            <div class="floating temple">🏛️</div>

            <div class="hero-content">

                <h2>Explora la Historia del Mundo</h2>

                <p>
                    Aprende mediante retos interactivos, viajes culturales
                    y aventuras educativas diseñadas para descubrir el pasado
                    de la humanidad.
                </p>

            </div>

        </div>

    </div>

<script src="../js/auth.js"></script>
</body>
</html>
