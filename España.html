<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>España | Historia Sin Fronteras</title>

    <link rel="stylesheet" href="Estilo.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="fondo"></div>

<main class="contenedor">

    <h1>🇪🇸 ESPAÑA</h1>

    <div class="imagen-pais">
        <img 
            src="https://media.admagazine.com/photos/63c9a4f6c0e0d93372ff71f8/master/w_1600%2Cc_limit/que-lugares-visitar-en-barcelona.jpg" 
            alt="España">
    </div>

    <h2>Explora su historia y cultura</h2>

    <!-- ================= CATEGORÍAS ================= -->

    <div class="categorias">

        <button class="categoria" onclick="mostrarHistoria()">
            <span>📜</span>
            HISTORIA
        </button>

        <button class="categoria" onclick="mostrarCultura()">
            <span>🎭</span>
            CULTURA
        </button>

    </div>


    <!-- ================= HISTORIA ================= -->

    <section id="historia" class="subcategorias">

        <h3>📜 Historia de España</h3>

        <div class="opciones">

            <button onclick="mostrarInfo('hispania')">
                🏺 Hispania romana
            </button>

            <button onclick="mostrarInfo('alandalus')">
                🕌 Al-Ándalus
            </button>

            <button onclick="mostrarInfo('reyes')">
                👑 Reyes Católicos
            </button>

            <button onclick="mostrarInfo('expansion')">
                ⛵ Expansión española
            </button>

            <button onclick="mostrarInfo('guerraCivil')">
                🇪🇸 Guerra Civil Española
            </button>

            <button onclick="mostrarInfo('contemporanea')">
                🏛️ España contemporánea
            </button>

            <button onclick="mostrarInfo('personajes')">
                👤 Personajes históricos
            </button>

        </div>

        <!-- INFORMACIÓN DE HISTORIA -->

        <div id="informacionHistoria" class="informacion">

            <h4 id="tituloInfo"></h4>

            <p id="textoInfo"></p>

        </div>

    </section>


    <!-- ================= CULTURA ================= -->

    <section id="cultura" class="subcategorias">

        <h3>🎭 Cultura de España</h3>

        <div class="opciones">

            <button onclick="mostrarCulturaInfo('flamenco')">
                💃 Flamenco
            </button>

            <button onclick="mostrarCulturaInfo('musica')">
                🎶 Música tradicional
            </button>

            <button onclick="mostrarCulturaInfo('gastronomia')">
                🥘 Gastronomía
            </button>

            <button onclick="mostrarCulturaInfo('arte')">
                🎨 Arte
            </button>

            <button onclick="mostrarCulturaInfo('fiestas')">
                🎉 Fiestas y celebraciones
            </button>

            <button onclick="mostrarCulturaInfo('deportes')">
                ⚽ Deportes
            </button>

            <button onclick="mostrarCulturaInfo('lenguas')">
                🗣️ Lenguas de España
            </button>

        </div>

        <!-- INFORMACIÓN DE CULTURA -->

        <div id="informacionCultura" class="informacion">

            <h4 id="tituloCultura"></h4>

            <p id="textoCultura"></p>

        </div>

    </section>

</main>


<script>

/* =====================================================
   MOSTRAR HISTORIA
===================================================== */

function mostrarHistoria() {

    document.getElementById("historia").style.display = "block";

    document.getElementById("cultura").style.display = "none";

}


/* =====================================================
   MOSTRAR CULTURA
===================================================== */

function mostrarCultura() {

    document.getElementById("cultura").style.display = "block";

    document.getElementById("historia").style.display = "none";

}


/* =====================================================
   INFORMACIÓN DE HISTORIA DE ESPAÑA
===================================================== */

const informacion = {

    hispania: {

        titulo: "🏺 Hispania romana",

        texto: `La conquista romana de la península ibérica comenzó en el año 218 a. C.
        durante la Segunda Guerra Púnica. Los romanos llamaron Hispania a los
        territorios que fueron incorporando.

        Roma construyó ciudades, caminos, puentes y otras obras que transformaron
        el territorio. También extendió el latín, que tuvo una gran influencia
        en las lenguas que posteriormente surgieron en la península.

        Hispania formó parte del Imperio romano durante varios siglos y fue
        una región importante para la economía y la cultura de Roma.`

    },


    alandalus: {

        titulo: "🕌 Al-Ándalus",

        texto: `En el año 711, grupos musulmanes procedentes del norte de África
        entraron en la península ibérica y derrotaron al reino visigodo.

        Gran parte del territorio pasó a formar parte de Al-Ándalus, una
        sociedad con importantes influencias árabes, bereberes, judías y
        cristianas.

        Córdoba se convirtió en uno de los principales centros culturales
        y científicos de Europa durante la Edad Media.

        La presencia musulmana en la península duró varios siglos y dejó
        importantes huellas en la arquitectura, la agricultura, la ciencia
        y el idioma.`

    },


    reyes: {

        titulo: "👑 Reyes Católicos",

        texto: `Isabel I de Castilla y Fernando II de Aragón son conocidos como
        los Reyes Católicos. Su matrimonio en 1469 unió dinásticamente sus
        territorios, aunque Castilla y Aragón mantuvieron sus propias
        instituciones.

        En 1492, sus tropas conquistaron Granada, último reino musulmán
        independiente de la península ibérica.

        Ese mismo año, Cristóbal Colón realizó su primer viaje al continente
        americano con apoyo de la Corona de Castilla.

        Estos acontecimientos marcaron una etapa fundamental en la historia
        de España.`

    },


    expansion: {

        titulo: "⛵ Expansión española",

        texto: `A partir de finales del siglo XV, la Corona española inició una
        importante expansión por diferentes territorios de América, Asia
        y otras regiones.

        Los viajes de exploración y conquista dieron lugar a la creación
        de un gran imperio colonial.

        España estableció ciudades, rutas comerciales e instituciones
        administrativas en sus territorios americanos.

        Este proceso también produjo profundos cambios para las poblaciones
        indígenas y dio origen a nuevas sociedades caracterizadas por la
        mezcla de diferentes culturas y poblaciones.`

    },


    guerraCivil: {

        titulo: "🇪🇸 Guerra Civil Española",

        texto: `La Guerra Civil Española ocurrió entre 1936 y 1939 y enfrentó
        a dos grandes bandos: el republicano y el sublevado.

        El conflicto estuvo relacionado con las fuertes divisiones políticas
        y sociales que existían en España durante la Segunda República.

        La guerra provocó una gran crisis humanitaria, desplazamientos y
        numerosas pérdidas humanas.

        En 1939 terminó la guerra con la victoria del bando dirigido por
        Francisco Franco, quien estableció una dictadura que permaneció
        en el poder durante varias décadas.`

    },


    contemporanea: {

        titulo: "🏛️ España contemporánea",

        texto: `Después de la muerte de Francisco Franco en 1975, España inició
        un proceso de transición hacia la democracia.

        En 1978 se aprobó una nueva Constitución que estableció el sistema
        democrático actual y reconoció derechos y libertades de los ciudadanos.

        España se convirtió en una monarquía parlamentaria y posteriormente
        se integró en diferentes organizaciones internacionales.

        Actualmente es un Estado formado por 17 comunidades autónomas y
        2 ciudades autónomas.`

    },


    personajes: {

        titulo: "👤 Personajes históricos",

        texto: `España ha tenido numerosos personajes importantes a lo largo
        de su historia.

        Isabel I de Castilla y Fernando II de Aragón fueron fundamentales
        durante la formación de la monarquía hispánica.

        Miguel de Cervantes fue uno de los escritores más importantes de
        la literatura española y autor de Don Quijote de la Mancha.

        Diego Velázquez fue uno de los grandes pintores del Siglo de Oro.

        También destacan figuras como Antoni Gaudí, arquitecto relacionado
        con el modernismo, y Santiago Ramón y Cajal, reconocido por sus
        importantes investigaciones científicas.`

    }

};


/* =====================================================
   MOSTRAR INFORMACIÓN DE HISTORIA
===================================================== */

function mostrarInfo(categoria) {

    document.getElementById("tituloInfo").textContent =
        informacion[categoria].titulo;

    document.getElementById("textoInfo").textContent =
        informacion[categoria].texto;

    document.getElementById("informacionHistoria").style.display = "block";

}


/* =====================================================
   INFORMACIÓN DE CULTURA DE ESPAÑA
===================================================== */

const informacionCultura = {

    flamenco: {

        titulo: "💃 Flamenco",

        texto: `El flamenco es una expresión artística asociada principalmente
        con Andalucía y combina el cante, el toque de guitarra y el baile.

        Su desarrollo recibió influencias de diferentes culturas y tradiciones
        presentes en el sur de España.

        El flamenco es reconocido internacionalmente y en 2010 fue inscrito
        por la UNESCO en la Lista Representativa del Patrimonio Cultural
        Inmaterial de la Humanidad.`

    },


    musica: {

        titulo: "🎶 Música tradicional",

        texto: `España posee una gran variedad de tradiciones musicales que
        cambian según cada región.

        Existen instrumentos tradicionales como la guitarra, la gaita,
        las castañuelas y diferentes tipos de tambores.

        Además de la música tradicional, España ha desarrollado importantes
        géneros de música clásica, popular, rock, pop y otros estilos
        contemporáneos.`

    },


    gastronomia: {

        titulo: "🥘 Gastronomía",

        texto: `La gastronomía española es muy diversa y cambia según la región.

        Algunos platos conocidos son la paella, la tortilla de patatas,
        el gazpacho y diferentes preparaciones de pescado y mariscos.

        También son importantes productos como el aceite de oliva, el queso,
        el jamón y una gran variedad de frutas y verduras.

        La dieta mediterránea tiene una importante presencia en muchas
        regiones españolas.`

    },


    arte: {

        titulo: "🎨 Arte",

        texto: `España ha producido importantes artistas a lo largo de la historia.

        Diego Velázquez, Francisco de Goya, Pablo Picasso y Salvador Dalí
        son algunos de los artistas españoles más reconocidos.

        La arquitectura también ocupa un lugar importante. Antoni Gaudí
        desarrolló obras destacadas en Barcelona, especialmente relacionadas
        con el modernismo.

        Los museos españoles conservan obras de diferentes períodos
        artísticos.`

    },


    fiestas: {

        titulo: "🎉 Fiestas y celebraciones",

        texto: `España tiene numerosas fiestas tradicionales que varían según
        cada región.

        Entre las más conocidas se encuentran las Fallas de Valencia,
        los Sanfermines de Pamplona y la Semana Santa, que se celebra
        de diferentes maneras en muchas ciudades.

        También son importantes las fiestas locales y las celebraciones
        relacionadas con las tradiciones religiosas y culturales de cada
        comunidad.`

    },


    deportes: {

        titulo: "⚽ Deportes",

        texto: `El fútbol es uno de los deportes más populares de España.

        La selección masculina ganó la Copa Mundial de la FIFA en 2010
        y también ha conseguido títulos importantes en competiciones
        europeas.

        Otros deportes destacados son el baloncesto, el tenis, el ciclismo,
        el motociclismo y el automovilismo.

        España también ha tenido deportistas reconocidos internacionalmente
        en diferentes disciplinas.`

    },


    lenguas: {

        titulo: "🗣️ Lenguas de España",

        texto: `El castellano o español es la lengua oficial del Estado.

        Además, algunas comunidades autónomas tienen otras lenguas oficiales
        junto con el castellano. Entre ellas se encuentran el catalán,
        el gallego y el euskera.

        También existen otras variedades lingüísticas, como el aranés,
        reconocidas en determinados territorios.

        Esta variedad lingüística forma parte de la diversidad cultural
        de España.`

    }

};


/* =====================================================
   MOSTRAR INFORMACIÓN DE CULTURA
===================================================== */

function mostrarCulturaInfo(categoria) {

    document.getElementById("tituloCultura").textContent =
        informacionCultura[categoria].titulo;

    document.getElementById("textoCultura").textContent =
        informacionCultura[categoria].texto;

    document.getElementById("informacionCultura").style.display = "block";

}


/* =====================================================
   AL CARGAR LA PÁGINA
===================================================== */

document.getElementById("historia").style.display = "none";

document.getElementById("cultura").style.display = "none";

</script>

</body>
</html>
