<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estados Unidos | Historia Sin Fronteras</title>

    <link rel="stylesheet" href="Estilo.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="fondo"></div>

<main class="contenedor">

    <h1>🇺🇸 ESTADOS UNIDOS</h1>

    <div class="imagen-pais">
        <img 
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRb94fgA4bFJEaAQ0ZerSD4oTGCRPsAhLuvKbb33wfR0yHa3K8WckdyTnVc&s=10" 
            alt="Estados Unidos">
    </div>

    <h2>Explora su historia y cultura</h2>


    <!-- ================= CATEGORÍAS ================= -->

    <div class="categorias">

        <button class="categoria" onclick="mostrarHistoria()">
            <span>📜</span>
            HISTORIA
        </button>

        <button class="categoria" onclick="mostrarCultura()">
            <span>🎭</span>
            CULTURA
        </button>

    </div>


    <!-- ================= HISTORIA ================= -->

    <section id="historia" class="subcategorias">

        <h3>📜 Historia de Estados Unidos</h3>

        <div class="opciones">

            <button onclick="mostrarInfo('pueblos')">
                🗿 Pueblos originarios
            </button>

            <button onclick="mostrarInfo('colonizacion')">
                ⛵ Colonización europea
            </button>

            <button onclick="mostrarInfo('independencia')">
                🇺🇸 Independencia
            </button>

            <button onclick="mostrarInfo('secesion')">
                ⚔️ Guerra de Secesión
            </button>

            <button onclick="mostrarInfo('industrializacion')">
                🏭 Industrialización
            </button>

            <button onclick="mostrarInfo('mundo')">
                🌎 Estados Unidos en el mundo
            </button>

            <button onclick="mostrarInfo('personajes')">
                👤 Personajes históricos
            </button>

        </div>


        <!-- INFORMACIÓN DE HISTORIA -->

        <div id="informacionHistoria" class="informacion">

            <h4 id="tituloInfo"></h4>

            <p id="textoInfo"></p>

        </div>

    </section>


    <!-- ================= CULTURA ================= -->

    <section id="cultura" class="subcategorias">

        <h3>🎭 Cultura de Estados Unidos</h3>

        <div class="opciones">

            <button onclick="mostrarCulturaInfo('musica')">
                🎵 Música
            </button>

            <button onclick="mostrarCulturaInfo('cine')">
                🎬 Cine y televisión
            </button>

            <button onclick="mostrarCulturaInfo('gastronomia')">
                🍔 Gastronomía
            </button>

            <button onclick="mostrarCulturaInfo('deportes')">
                🏀 Deportes
            </button>

            <button onclick="mostrarCulturaInfo('arte')">
                🎨 Arte
            </button>

            <button onclick="mostrarCulturaInfo('celebraciones')">
                🎉 Celebraciones
            </button>

            <button onclick="mostrarCulturaInfo('diversidad')">
                🗣️ Diversidad cultural
            </button>

        </div>


        <!-- INFORMACIÓN DE CULTURA -->

        <div id="informacionCultura" class="informacion">

            <h4 id="tituloCultura"></h4>

            <p id="textoCultura"></p>

        </div>

    </section>

</main>


<script>

/* =====================================================
   MOSTRAR HISTORIA
===================================================== */

function mostrarHistoria() {

    document.getElementById("historia").style.display = "block";

    document.getElementById("cultura").style.display = "none";

}


/* =====================================================
   MOSTRAR CULTURA
===================================================== */

function mostrarCultura() {

    document.getElementById("cultura").style.display = "block";

    document.getElementById("historia").style.display = "none";

}


/* =====================================================
   INFORMACIÓN DE HISTORIA
===================================================== */

const informacion = {

    pueblos: {

        titulo: "🗿 Pueblos originarios",

        texto: `Mucho antes de la llegada de los europeos, el territorio que hoy
        forma Estados Unidos estaba habitado por numerosos pueblos indígenas.

        Entre ellos existían comunidades como los iroqueses, cherokee, sioux,
        navajos y muchos otros pueblos con diferentes lenguas, tradiciones y
        formas de organización.

        Practicaban actividades como la agricultura, la pesca, la caza y el
        comercio. También desarrollaron importantes conocimientos sobre la
        naturaleza y el territorio.`

    },


    colonizacion: {

        titulo: "⛵ Colonización europea",

        texto: `Desde finales del siglo XV y durante los siglos siguientes,
        diferentes países europeos exploraron y establecieron colonias
        en América del Norte.

        Inglaterra fundó varias colonias en la costa atlántica. También hubo
        presencia francesa, española y neerlandesa en diferentes regiones.

        Las colonias desarrollaron actividades agrícolas y comerciales y
        recibieron población europea. Este proceso tuvo consecuencias
        profundas para los pueblos indígenas que ya habitaban el territorio.`

    },


    independencia: {

        titulo: "🇺🇸 Independencia",

        texto: `Las Trece Colonias británicas de América del Norte declararon su
        independencia de Gran Bretaña el 4 de julio de 1776.

        La Guerra de Independencia estadounidense se desarrolló entre
        1775 y 1783. George Washington fue uno de los principales líderes
        militares de las colonias.

        En 1783, Gran Bretaña reconoció la independencia de Estados Unidos
        mediante el Tratado de París.

        Posteriormente se estableció un nuevo sistema político basado en
        la Constitución de 1787.`

    },


    secesion: {

        titulo: "⚔️ Guerra de Secesión",

        texto: `La Guerra de Secesión ocurrió entre 1861 y 1865 y enfrentó
        a los estados de la Unión con los estados confederados que habían
        decidido separarse.

        Entre las principales causas estuvieron las diferencias económicas,
        políticas y sociales entre las regiones, especialmente el conflicto
        relacionado con la esclavitud.

        Abraham Lincoln fue presidente durante gran parte del conflicto.

        La Unión ganó la guerra en 1865 y poco después se abolió
        constitucionalmente la esclavitud mediante la Decimotercera Enmienda.`

    },


    industrializacion: {

        titulo: "🏭 Industrialización",

        texto: `Durante el siglo XIX y comienzos del siglo XX, Estados Unidos
        experimentó una rápida industrialización.

        Crecieron las fábricas, los ferrocarriles y las ciudades. También
        aumentó la producción de acero, petróleo, maquinaria y otros productos.

        La inmigración contribuyó al crecimiento de la población y de la
        fuerza laboral.

        La industrialización convirtió a Estados Unidos en una de las
        principales potencias económicas del mundo.`

    },


    mundo: {

        titulo: "🌎 Estados Unidos en el mundo",

        texto: `Durante el siglo XX, Estados Unidos aumentó considerablemente
        su influencia internacional.

        El país participó en las dos guerras mundiales y tuvo un papel
        importante en la creación de organizaciones internacionales.

        Después de la Segunda Guerra Mundial, Estados Unidos se convirtió
        en una de las principales potencias mundiales y tuvo un papel central
        durante la Guerra Fría.

        Actualmente mantiene una importante influencia económica, política,
        científica, tecnológica y cultural a nivel internacional.`

    },


    personajes: {

        titulo: "👤 Personajes históricos",

        texto: `La historia de Estados Unidos cuenta con numerosos personajes
        importantes.

        George Washington fue uno de los líderes de la independencia y
        se convirtió en el primer presidente del país.

        Abraham Lincoln fue presidente durante la Guerra de Secesión y
        defendió la preservación de la Unión y la abolición de la esclavitud.

        Martin Luther King Jr. fue un importante líder del movimiento por
        los derechos civiles de la población afroamericana.

        Thomas Edison fue un inventor y empresario relacionado con el
        desarrollo de importantes tecnologías eléctricas.`

    }

};


/* =====================================================
   MOSTRAR INFORMACIÓN DE HISTORIA
===================================================== */

function mostrarInfo(categoria) {

    document.getElementById("tituloInfo").textContent =
        informacion[categoria].titulo;

    document.getElementById("textoInfo").textContent =
        informacion[categoria].texto;

    document.getElementById("informacionHistoria").style.display = "block";

}


/* =====================================================
   INFORMACIÓN DE CULTURA
===================================================== */

const informacionCultura = {

    musica: {

        titulo: "🎵 Música",

        texto: `Estados Unidos ha tenido una enorme influencia en la música
        popular mundial.

        En el país se desarrollaron o tuvieron gran crecimiento géneros
        como el blues, jazz, gospel, country, rock, hip hop y pop.

        La música afroamericana tuvo un papel fundamental en el desarrollo
        de muchos de estos estilos.

        Ciudades como Nueva Orleans, Nueva York, Chicago y Nashville han
        sido importantes centros musicales.`

    },


    cine: {

        titulo: "🎬 Cine y televisión",

        texto: `Estados Unidos posee una de las industrias cinematográficas
        y televisivas más importantes del mundo.

        Hollywood, ubicado en Los Ángeles, se convirtió en un importante
        centro de producción cinematográfica durante el siglo XX.

        Las películas y programas estadounidenses han tenido una gran
        influencia internacional y han contribuido a difundir diferentes
        estilos, historias y formas de entretenimiento.`

    },


    gastronomia: {

        titulo: "🍔 Gastronomía",

        texto: `La gastronomía de Estados Unidos refleja las influencias de
        diferentes comunidades y regiones.

        Algunos alimentos conocidos internacionalmente son las hamburguesas,
        el hot dog, el pollo frito y diferentes tipos de barbacoa.

        También existen platos tradicionales de distintas regiones,
        como el gumbo de Luisiana, el clam chowder de Nueva Inglaterra
        y diferentes preparaciones con maíz, carne y mariscos.

        La inmigración ha contribuido a ampliar la variedad gastronómica.`

    },


    deportes: {

        titulo: "🏀 Deportes",

        texto: `Los deportes ocupan un lugar importante en la cultura de
        Estados Unidos.

        Entre los más populares se encuentran el baloncesto, el fútbol
        americano, el béisbol y el hockey sobre hielo.

        También tienen gran importancia el tenis, el golf, el atletismo
        y los deportes de motor.

        Estados Unidos cuenta con importantes ligas profesionales y ha
        organizado numerosos eventos deportivos internacionales.`

    },


    arte: {

        titulo: "🎨 Arte",

        texto: `El arte estadounidense incluye diferentes expresiones como
        pintura, escultura, fotografía, arquitectura y arte contemporáneo.

        Durante el siglo XX surgieron movimientos artísticos importantes,
        especialmente en ciudades como Nueva York.

        El país también cuenta con numerosos museos y centros culturales
        que conservan obras de diferentes épocas y estilos.

        El arte estadounidense ha recibido influencias de las culturas
        indígenas, europeas, africanas, latinoamericanas y asiáticas.`

    },


    celebraciones: {

        titulo: "🎉 Celebraciones",

        texto: `Estados Unidos tiene numerosas celebraciones y días festivos.

        El Día de la Independencia se celebra el 4 de julio y conmemora
        la Declaración de Independencia de 1776.

        Thanksgiving o Día de Acción de Gracias se celebra en noviembre
        y es una de las principales reuniones familiares del país.

        También son populares celebraciones como Halloween, Navidad
        y diferentes festividades locales y culturales.`

    },


    diversidad: {

        titulo: "🗣️ Diversidad cultural",

        texto: `Estados Unidos es una sociedad culturalmente diversa formada
        por pueblos indígenas y comunidades procedentes de diferentes
        regiones del mundo.

        El inglés es el idioma más utilizado, aunque se hablan muchos
        otros idiomas, especialmente español, chino y otras lenguas.

        Esta diversidad se refleja en la música, la gastronomía, las
        celebraciones, las artes y las costumbres de las diferentes
        comunidades.`

    }

};


/* =====================================================
   MOSTRAR INFORMACIÓN DE CULTURA
===================================================== */

function mostrarCulturaInfo(categoria) {

    document.getElementById("tituloCultura").textContent =
        informacionCultura[categoria].titulo;

    document.getElementById("textoCultura").textContent =
        informacionCultura[categoria].texto;

    document.getElementById("informacionCultura").style.display = "block";

}


/* =====================================================
   AL CARGAR LA PÁGINA
===================================================== */

document.getElementById("historia").style.display = "none";

document.getElementById("cultura").style.display = "none";

</script>

</body>
</html>
